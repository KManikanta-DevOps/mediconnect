# One Argo CD Application per service, all from the same Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: mediconnect, namespace: argocd }
spec:
  generators:
    - list:
        elements:
          - { service: auth-service }
          - { service: appointment-service }
          - { service: patient-records-service }
          - { service: notification-service }
  template:
    metadata: { name: "{{service}}-dev" }
    spec:
      project: mediconnect
      source:
        repoURL: https://github.com/YOUR_GH_USER/mediconnect.git
        targetRevision: main
        path: helm/mediconnect-service
        helm:
          valueFiles: ["../environments/dev/{{service}}.yaml"]
      destination: { server: https://kubernetes.default.svc, namespace: mediconnect }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
