name: ci
on:
  pull_request:
  push: { branches: [main] }

permissions:
  id-token: write   # OIDC to AWS
  contents: write   # bump image tag in git
  security-events: write

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, appointment-service, patient-records-service, notification-service]
    defaults: { run: { working-directory: "services/${{ matrix.service }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q

  sonar:
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1   # fails the build if the gate fails
        timeout-minutes: 5
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          config_file: .checkov.yaml

  build-scan-push:
    needs: [test, iac-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, appointment-service, patient-records-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t local/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - if: github.ref == 'refs/heads/main'
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/mediconnect/${{ matrix.service }}:${{ github.sha }}
          docker tag local/${{ matrix.service }}:${{ github.sha }} $IMG
          docker push $IMG

  gitops-bump:
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tags in Helm values (Argo CD picks it up)
        run: |
          for f in helm/environments/dev/*.yaml; do
            sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" "$f"
          done
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "ci: deploy ${{ github.sha }} to dev [skip ci]" || exit 0
          git push
