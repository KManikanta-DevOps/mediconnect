server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  resolver 172.20.0.10 valid=10s ipv6=off;

  location /auth/ {
    set $backend auth-service.mediconnect.svc.cluster.local;
    proxy_pass http://$backend:80;
  }

  location /appointments {
    set $backend appointment-service.mediconnect.svc.cluster.local;
    proxy_pass http://$backend:80;
  }

  location /records {
    set $backend patient-records-service.mediconnect.svc.cluster.local;
    proxy_pass http://$backend:80;
  }

  location / {
    try_files $uri /index.html;
  }
}
